# Publishes NUKEHAUS to GitHub Pages.
#
# The site is the single-file build: one request, everything inlined, no
# external fetches. It is rebuilt from source on every push to main so the
# page can never drift from the code.
name: Publish NUKEHAUS to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a run in progress finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # esbuild is the only thing the bundle needs. Playwright's browser
      # download is the slow part of a plain `npm ci` and the build never
      # opens a browser, so it is skipped here.
      - name: Install build dependencies
        run: npm install --no-save esbuild@^0.28.2
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Build the single-file game
        run: node tools/bundle.js

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp dist/nukehaus.html _site/index.html
          cp dist/nukehaus.html _site/nukehaus.html
          test -s _site/index.html

      # enablement: true turns Pages on for the repository if it is off, so
      # this workflow is the only step needed to get the game on the web.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
