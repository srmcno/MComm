# Publishes NUKEHAUS to GitHub Pages.
#
# The site is the single-file build: one request, everything inlined, no
# external fetches. It is rebuilt from source on every push to main, so the
# published game can never drift from the code.
#
# This deploys by committing the built file to the gh-pages branch rather than
# through actions/deploy-pages. The Pages REST API refuses the workflow token
# ("Resource not accessible by integration" — creating a Pages site needs repo
# admin rights, which GITHUB_TOKEN does not have), so the artifact route cannot
# bootstrap the site on its own. Pushing a branch needs only contents: write.
name: Publish NUKEHAUS to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One deploy at a time; let a run in progress finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # esbuild is the only thing the bundle needs. Playwright's browser
      # download is the slow part of a plain `npm ci`, and the build never
      # opens a browser.
      - name: Install build dependencies
        run: npm install --no-save esbuild@^0.28.2
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Build the single-file game
        run: node tools/bundle.js

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp dist/nukehaus.html _site/index.html
          cp dist/nukehaus.html _site/nukehaus.html
          # Without this, Pages runs the file through Jekyll.
          touch _site/.nojekyll
          test -s _site/index.html

      - name: Publish to gh-pages
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git fetch origin gh-pages --depth=1 || true
          git worktree add /tmp/ghp gh-pages 2>/dev/null \
            || git worktree add --orphan -b gh-pages /tmp/ghp
          # The site is only ever these files; drop anything stale.
          find /tmp/ghp -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp _site/index.html _site/nukehaus.html /tmp/ghp/
          touch /tmp/ghp/.nojekyll
          cd /tmp/ghp
          git add -A
          if git diff --cached --quiet; then
            echo 'Site is already current; nothing to publish.'
            exit 0
          fi
          git commit -m "Publish ${GITHUB_SHA::7}"
          git push origin gh-pages
